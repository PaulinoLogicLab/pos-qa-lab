[project]
name = "pos-qa-lab"
version = "0.4.0"
description = "Laboratorio de QA com Robot Framework para jornada de pagamento e terminal Android"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.32",
    "robotframework>=7.0",
    "robotframework-pabot>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "coverage>=7.0",
    "ruff>=0.6",
]
device = [
    "robotframework-appiumlibrary>=2.0",
    "Appium-Python-Client>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
